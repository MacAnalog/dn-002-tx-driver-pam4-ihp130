# PAM-4 driver (IHP SG13G2) — sizing + layout CO-DESIGN through the SpiceXplorer platform.
#
# The paper's Algorithm 1 (layout-in-the-loop co-design): the agent writes the
# generator G (../gen_layout.py) and DRC-safe knob bounds (this file), and
# SpiceXplorer runs the joint search theta = (theta_E, theta_L): one trial =
# build GDS -> DRC -> LVS -> kpex -> post-layout benches (flow.yaml). Trials
# that fail DRC/LVS score MAX_PENALTY on every gated metric (skip); the report
# goes back to the agent, which fixes G and repeats.
#
#   theta_E (electrical): nx, tail_ma, rc_ohm, rb_ohm, re_ohm, cdeg_ff, vcasc
#   theta_L (layout):     resistor widths + every floorplan spacing below
#   theta_S (structural): the INT floorplan options (c_strip ... cell_order)
#
# ROUND 4b, islands s10-s12: `init` = the record with the tail bumped to 14.7 mA (swing hinge)
# and the two review options ON (vcc_trim 1, rb_off -9.25, in_bus_lvl 3) — the r2 lesson:
# structural knobs are seeded on in their own island. Otherwise identical to project_setup.yaml.
# ROUND 4 base file text follows. `init` there = the layout of record (gen_layout.FINAL_LAYOUT +
# FINAL_BIASES = r3_s12/run_26, the round-3 best-score point the TCAS paper
# presents), so trial 1 of every island must reproduce its scorecard at the
# search instrument (kpex CC halo 20, exact band edges; results/r3/summary.json
# `best`):
#   S11 -10.195 / S22 -10.258 / gain 2.380 / 8.358 / BW 61.19 / swing 2.106 /
#   power 167.16 mW / area 7268 um2 / balance 0.0267 dB / 0.455 deg / -47.40 dBc.
#
# Why a round 4 (owner brief 2026-09-02: "a design point that is competitive
# when reviewers see it", not a higher score). The reviewer-evidence sweep on
# the record (36 PVT corners + 400-sample mismatch MC, measured with this very
# hook) showed the round-3 point sits ON two of its walls: swing 2.106 against
# a 2.1 Vpp spec and MSB gain 8.36 against 8.2 dB — the round-3 power reward
# (0.15/mW) drove the tail down until both bound. At corners the same two go
# first (swing 1.74 Vpp at ff/4.2 V/-40 C, MSB gain 6.5 dB at ss/4.2 V/-40 C).
# A point a reviewer accepts needs margin on every row of the table, so:
#
#  1. The reviewer margins become HINGES (same specs S, tighter feasibility):
#     swing >= 2.2 Vpp (+0.1), msb_gain >= 8.3 dB (+0.1), lsb_gain >= 2.3 dB
#     (+0.1), bw >= 55 GHz (+5). The record is infeasible on swing (2.106) at
#     trial 1 — a single, small violation the search has to climb out of; the
#     v4 acceptance point (r3_s23/run_30: swing 2.237, gain 8.24 -> fails the
#     gain hinge by 0.06) is the second island seed.
#  2. msb_gain gains a small REWARD (2/dB): the silicon reference reads 9.2 dB
#     against our 8.36, the one row of the table where the record trails it.
#  3. Everything else is the round-3 J unchanged: S11 5/dB, S22 2/dB, balance
#     30/dB, 2/deg, 0.5/dB, power 0.15/mW, area 0.2 per 1000 um2. So the search
#     still buys power and balance — but only from feasible-with-margin points.
#
# NOTE the scores of r4 are NOT comparable with r3 (tighter hinges + gain
# reward). Acceptance for this round: every spec of S with the margins above,
# power and balance no worse than a reviewer would expect from the round-3
# column, and the 36-corner PVT sweep (reviewer evidence harness) no worse
# than the record's at its worst corner. `in_order` is dropped (measured null
# in r3). Islands: rounds/r4_s*_project_setup.yaml differ only in `init`
# (record / v4 acceptance point / margin-bumped record) and the algorithm.

project:
  name: PAM4-DRIVER-CODESIGN
  description: sizing + layout co-design of the PAM-4 driver DAC (IHP SG13G2) for post-layout p/n balance and S11/S22 margin under the eight signoff specs
  simulator: none            # unused by the layout backend (a required DSL field)
  save_sim: false
  parallel_sim: false
  sim_engine: layout

  ws_root: ..
  netlist: flow.yaml         # the DUT "netlist" is the layout-flow spec
  outdir: temp_spice_out     # <outdir>/layout/<testbench>/run_<n>_<label>/{pam4drv_pam4_lay.gds, drc/, lvs/, pex/, measure.log, summary.json}

  tech_spec:
    name: ihp-sg13g2
    constraints: {}

  # ------------------------------------------------------------------
  # theta_E — electrical sizing. nx / re_ohm / rc_ohm / rb_ohm / cdeg_ff are
  # LayoutParams fields (they draw geometry: HBT fingers, rsil lengths, cmim
  # size); tail_ma / vcasc are bench-only (deck_params -> measure_post.py: the
  # ideal tail source and the cascode bias live in the testbench, as in the
  # schematic DUTs). Validity: I_C < 3 mA per emitter finger (model card) is
  # the `ic_ma_per_finger` spec; the rsil body-length floor (re_ohm*re_w >= 12.6)
  # fails the build (-> penalty) — bounds keep it rare.
  # NOTE the binding electrical constraint of this box is msb_gain: v3 sits at
  # 8.205 dB against a spec of 8.2, and gain ~ gm*Rc/(1+gm*Re), so anything
  # that lowers the tail current (the power reward) has to buy the gain back
  # on re_ohm (3.24 at v3, floor 2.8) or rc_ohm.
  # ------------------------------------------------------------------
  dut_params:
    - { name: nx,        min_val: 2,    max_val: 4,    init: 3,     is_integer: true, description: "npn13G2 emitter fingers per device" }
    - { name: tail_ma,   min_val: 10.0, max_val: 17.5, init: 14.7, description: "tail current per gain cell (mA)" }
    - { name: rc_ohm,    min_val: 40.0, max_val: 70.0, init: 51.77, description: "collector load per side (ohm, on-chip back-termination)" }
    - { name: rb_ohm,    min_val: 40.0, max_val: 60.0, init: 48.32, description: "input termination per side (ohm)" }
    - { name: re_ohm,    min_val: 2.8,  max_val: 6.0,  init: 3.09,  description: "emitter degeneration per side (ohm)" }
    - { name: cdeg_ff,   min_val: 12.0, max_val: 32.0, init: 16.84, description: "emitter bridging cap (fF, HF peaking)" }
    - { name: vcasc,     min_val: 3.0,  max_val: 3.4,  init: 3.3427,  description: "cascode base bias (V)" }
    # ------------------------------------------------------------------
    # theta_L — layout knobs (um). Resistor lengths always re-derive from the
    # rsil model (R = 7*l/w + 9/w) so every candidate holds its resistance —
    # widths trade area/EM against parasitics. Bounds are the DRC-safe ranges
    # of the generator (TM1 min width 1.64, TM2 2.0, TopVia2 pad 1.9, ...).
    # ------------------------------------------------------------------
    - { name: re_w,      min_val: 4.5,  max_val: 10.0, init: 5.66, description: "RE rsil width (16 mA/cell path)" }
    - { name: rc_w,      min_val: 1.0,  max_val: 3.0,  init: 1.51, description: "RC rsil width (24 mA path)" }
    - { name: rb_w,      min_val: 0.5,  max_val: 1.5,  init: 0.68, description: "RB rsil width" }
    - { name: gap_x,     min_val: 5.5,  max_val: 9.0,  init: 5.65,  description: "inner gap of a differential pair (Cdeg lives here)" }
    - { name: row_gap,   min_val: 1.2,  max_val: 3.0,  init: 1.91, description: "input row -> cascode row" }
    - { name: cell_gap,  min_val: 4.0,  max_val: 9.0,  init: 4.21, description: "gap between gain cells (row length)" }
    - { name: out_gap,   min_val: 3.0,  max_val: 20.0, init: 3.18, description: "outp <-> outn bus edge gap (differential sidewall C; >= TM2 space 2.0)" }
    - { name: out_w,     min_val: 1.64, max_val: 3.0,  init: 1.97, description: "output bus width (TM1 min 1.64; clamped to 2.0 on TM2)" }
    - { name: w_out,     min_val: 1.5,  max_val: 3.0,  init: 1.68, description: "output Metal2 riser width" }
    - { name: out_off,   min_val: 1.2,  max_val: 5.0,  init: 2.06,  description: "sub bus -> outp bus" }
    - { name: rc_sep,    min_val: 4.0,  max_val: 8.0,  init: 4.48, description: "RCp <-> RCn column separation" }
    - { name: rc_gap,    min_val: 2.0,  max_val: 8.0,  init: 2.87,  description: "outn bus -> RC body; ALSO outn bus -> TopMetal2 vcc rail (r3: outn<->vcc is 2.33 fF vs outp's 0.25 fF)" }
    - { name: in_off,    min_val: 1.0,  max_val: 4.0,  init: 2.18, description: "tail bus -> first input bus" }
    - { name: in_bus_gap, min_val: 1.0, max_val: 4.0,  init: 3.26, description: "input bus pair gap (Metal4)" }
    - { name: sub_off,   min_val: 1.0,  max_val: 3.0,  init: 1.33, description: "cascode row -> substrate bus" }
    - { name: stack_w,   min_val: 1.1,  max_val: 2.5,  init: 1.47, description: "via-stack pad size (per-via clamped)" }
    # ------------------------------------------------------------------
    # theta_S — structural options (gen_layout.py). INT knobs so the search,
    # not the author, picks the floorplan variant. init = the v3 point.
    # ------------------------------------------------------------------
    - { name: c_strip,    min_val: 0, max_val: 2, init: 2, is_integer: true, description: "cascode-collector M2 tap: 0 full strip | 1 upper-half strip | 2 riser-width tab (outp<->c1 sidewall C)" }
    - { name: bus_trim,   min_val: 0, max_val: 1, init: 1, is_integer: true, description: "1 = each output bus spans only its own risers + RC (-16 um TM1, shorter outp||outn run)" }
    - { name: out_split,  min_val: 0, max_val: 3, init: 1, is_integer: true, description: "output-bus metal: 0 both TM1 | 1 outn on TM2 (v3) | 2 BOTH on TM2 (symmetric, r3) | 3 outp on TM2 (mirrored, r3)" }
    - { name: sub_bus,    min_val: 0, max_val: 1, init: 1, is_integer: true, description: "0 = Metal3 substrate bus | 1 = taps tie to the ring on Metal1 (no bus under the output risers)" }
    - { name: cell_order, min_val: 0, max_val: 1, init: 1, is_integer: true, description: "0 = M0|L0|M1 | 1 = M0|M1|L0 (shorter MSB input bus)" }
    # --- r4b: the review-driven options (sx-scratch/pam4-codesign-r4/review_run26.md) ---
    - { name: vcc_trim,   min_val: 0, max_val: 1, init: 1, is_integer: true, description: "1 = TopMetal2 vcc rail trimmed to the RC stacks + feed stub (kills the 64 um coplanar outn<->vcc run: 1.30 vs 0.18 fF, the phase-imbalance / diff->CM owner)" }
    - { name: rb_off,     min_val: -9.5, max_val: 3.0, init: -9.25, description: "slide of the centre-fed R_B block (um): -9.75 equalises the msbp/msbn M4 bus extents (45.4 vs 32.7 um, the gain-imbalance owner)" }
    - { name: in_bus_lvl, min_val: 3, max_val: 5, init: 3, is_integer: true, description: "input-bus metal 3/4/5 (existing generator field never searched in r3; 4 = the record's Metal4)" }

  testbenches:
    - name: layout
      description: "build -> DRC -> LVS -> kpex CC -> driver_lib benches on the extracted pam4 DUT (measure_post.py)"
      netlist: flow.yaml
      params: []
      enable: true

  optimizer_config:
    type: nevergrad
    name: OnePlusOne
    budget: 40
    random_seed: 0
    seed_from_init: true
    optimizer_kwargs: {num_workers: 4}
    lin_variable_bounds: {min: 0, max: 1}
    log_variable_bounds: {min: 1, max: 100}
    # J = the paper's feasibility_reward: while ANY spec below is violated the
    # score is the weighted penalty sum; once every one holds, the score is the
    # sum of the reward terms (margin beyond the target / range * weight).
    #   s11   5.0 per dB below -10      s22   2.0 per dB below -10
    #   cm_leak 0.5 per dB below the hinge   pn_phase 2.0 per degree
    #   pn_gain 30 per dB (i.e. 0.3 per 0.01 dB)   power 0.15 per mW
    #   area 0.2 per 1000 um2 under the paper's 11 300 um2
    target_specs:
      # --- reflection: spec AND objective ---
      - { name: s11,   testbench: layout, sim_type: layout, goal: minimize, target: -10.0, range: 2.0, tolerance: 0, weight: 10, error_type: relative-absolute, reward_type: relative-absolute,
          description: "worst-path S11 <= 32 GHz (dB); reward = 5/dB of margin below -10 dB (r2 slope x2.5: v3's margin is only 0.07 dB)" }
      - { name: s22,   testbench: layout, sim_type: layout, goal: minimize, target: -10.0, range: 5.0, tolerance: 0, weight: 10, error_type: relative-absolute, reward_type: relative-absolute,
          description: "S22 <= 50 GHz (dB); reward = 2/dB of margin below -10 dB" }
      # --- p/n balance: the round-3 objective (owner priority 1). Hinges are
      #     set just above the MEASURED halo-20 v3 values so init is feasible;
      #     the reward is what drives the search toward v2-level symmetry
      #     (0.03 dB / 0.5 deg / -46.5 dBc, halo 8). ---
      - { name: pn_gain_imb_db,   testbench: layout, sim_type: layout, goal: minimize, target: 0.05,  range: 0.1, tolerance: 0, weight: 3, error_type: relative-absolute, reward_type: relative-absolute,
          description: "max |20log|Vp|-20log|Vn|| of the MSB path <= 48 GHz (dB); reward 30/dB" }
      - { name: pn_phase_imb_deg, testbench: layout, sim_type: layout, goal: minimize, target: 1.0,  range: 2.0,  tolerance: 0, weight: 4, error_type: relative-absolute, reward_type: relative-absolute,
          description: "max deviation of the p/n output phase from 180 deg <= 48 GHz; reward 2/deg" }
      - { name: cm_leak_dbc,      testbench: layout, sim_type: layout, goal: minimize, target: -40.0, range: 10.0, tolerance: 0, weight: 5, error_type: relative-absolute, reward_type: relative-absolute,
          description: "differential-to-common-mode conversion 20log|Vp+Vn|/|Vp-Vn|, worst <= 48 GHz (dBc); reward 0.5/dB" }
      # --- power (owner priority 3) and area: spec + small reward ---
      - { name: power,    testbench: layout, sim_type: layout, goal: minimize, target: 192.0, range: 20.0, tolerance: 0, weight: 3, error_type: relative-absolute, reward_type: relative-absolute,
          description: "supply power at 4 V (mW); reward 0.15/mW under the 192 mW spec" }
      - { name: area_um2, testbench: layout, sim_type: layout, goal: minimize, target: 11300, range: 5000, tolerance: 0, weight: 1, error_type: relative-absolute, reward_type: relative-absolute,
          description: "core bbox area; the paper's chip is 11 300 um2" }
      # --- the remaining signoff specs as bounds (no reward) ---
      # --- r4: reviewer margins as hinges (+0.1 dB gain, +0.1 Vpp swing, +5 GHz BW)
      #     and a small gain reward: the reference silicon reads 9.2 dB MSB. ---
      - { name: msb_gain, testbench: layout, sim_type: layout, goal: exceed,   target: 8.3,  range: 1.0, tolerance: 0, weight: 2, error_type: relative-absolute, reward_type: relative-absolute,
          description: "MSB path gain (dB); hinge 8.3 = spec 8.2 + 0.1 margin; reward 2/dB above the hinge" }
      - { name: lsb_gain, testbench: layout, sim_type: layout, goal: exceed,   target: 2.3,  range: 1.0, tolerance: 0, weight: 5, reward_type: none }
      - { name: weight,   testbench: layout, sim_type: layout, goal: exceed,   target: 5.0,  range: 1.0, tolerance: 0, weight: 5, reward_type: none }
      - { name: bw,       testbench: layout, sim_type: layout, goal: exceed,   target: 55.0, range: 10.0, tolerance: 0, weight: 5, reward_type: none }
      - { name: swing,    testbench: layout, sim_type: layout, goal: exceed,   target: 2.2,  range: 0.2, tolerance: 0, weight: 5, reward_type: none,
          description: "differential swing (Vpp); hinge 2.2 = spec 2.1 + 0.1 margin (the record sits at 2.106)" }
      # --- validity + physical gates ---
      - { name: ic_ma_per_finger, testbench: layout, sim_type: layout, goal: minimize, target: 3.0, range: 1.0, tolerance: 0, weight: 50, reward_type: none,
          description: "npn13G2 model-card validity: I_C < 3 mA per emitter finger" }
      - { name: drc_pass,  testbench: layout, sim_type: layout, goal: exact, target: 1, tolerance: 0, range: 1, weight: 100, reward_type: none }
      - { name: lvs_match, testbench: layout, sim_type: layout, goal: exact, target: 1, tolerance: 0, range: 1, weight: 100, reward_type: none }
      - { name: pex_ok,    testbench: layout, sim_type: layout, goal: exact, target: 1, tolerance: 0, range: 1, weight: 100, reward_type: none }
